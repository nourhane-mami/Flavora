  <main class="inner">
   <p>
    <a href="member-dashboard.html">
     &lt; Back to my Dashboard
    </a>
   </p>
   <h1>
    Offering Evaluation
   </h1>
   <form action="#" class="form wide" method="post">
    <h2>
     Your Rating
    </h2>
    <label for="po">
     Which offering would you like to evaluate?*
    </label>
    <select id="po" required="">
     <option value="">
      Select from previous offerings
     </option>
     <option>
      Baking Class
     </option>
     <option>
      Healthy Cooking
     </option>
     <option>
      Pizza Workshop
     </option>
    </select>
    <fieldset class="rate">
     <legend>
      How would you rate this offering?*
     </legend>
     <input id="s5" name="rating" required="" type="radio" value="5">
     <label for="s5" title="5 stars">
      ★
     </label>
     <input id="s4" name="rating" required="" type="radio" value="4">
     <label for="s4" title="4 stars">
      ★
     </label>
     <input id="s3" name="rating" required="" type="radio" value="3">
     <label for="s3" title="3 stars">
      ★
     </label>
     <input id="s2" name="rating" required="" type="radio" value="2">
     <label for="s2" title="2 stars">
      ★
     </label>
     <input id="s1" name="rating" required="" type="radio" value="1">
     <label for="s1" title="1 stars">
      ★
     </label>
    </fieldset>
    <label for="fb">
     Your Feedback
    </label>
    <textarea id="fb" placeholder="Feedback ..." rows="4"></textarea>
    <label for="an">
     Any additional note?
    </label>
    <textarea id="an" placeholder="I would like to ..." rows="4"></textarea>
    <button class="center-btn" type="submit">
     Submit Evaluation
    </button>
   </form>
  </main>
